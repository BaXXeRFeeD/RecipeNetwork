services:
  db:
    image: postgres:16-alpine
    container_name: recipe-network-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-recipe_network}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-recipe_network}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe-network-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-recipe_network}
      DB_LOGGING: ${DB_LOGGING:-false}
      PASSWORD_SALT_ROUNDS: ${PASSWORD_SALT_ROUNDS:-10}
      JWT_SECRET: ${JWT_SECRET:-recipe-network-local-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    command: sh -c "npm run migration:run && npm run start:dev"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
